name: counting integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: counting_test
          POSTGRES_PASSWORD: counting_test
          POSTGRES_DB: counting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U counting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://counting_test:counting_test@localhost:5432/counting_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest python-dotenv discord.py==2.7.1 asyncpg
      - run: python -m pytest -q tests/test_counting.py tests/integration/test_counting_cog.py tests/postgres
