<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cigar Lounge — Hall of Fame</title>
<meta name="description" content="Season champions, title holders and all-time records of the Cigar Lounge Chivalry 2 community.">
<meta name="theme-color" content="#22242a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Cigar Lounge">
<meta property="og:title" content="Cigar Lounge — Hall of Fame">
<meta property="og:description" content="Season champions, title holders and all-time records of the Cigar Lounge Chivalry 2 community.">
<meta property="og:url" content="https://thecigarlounge.app/hof">
<meta property="og:image" content="https://thecigarlounge.app/assets/lounge_banner.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Cigar Lounge — Hall of Fame">
<meta name="twitter:description" content="Season champions, title holders and all-time records of the Cigar Lounge Chivalry 2 community.">
<meta name="twitter:image" content="https://thecigarlounge.app/assets/lounge_banner.jpg">
<link rel="icon" type="image/png" href="/assets/loungestaticcircle.png">
<style>
:root{
  --bg:#22242a;--panel:#2b2d34;--panel2:#31343c;--ink:#f2f3f5;--mut:#8b8f9a;
  --gold:#e0a84c;--blue:#5b8dd9;--coral:#d85a30;--teal:#4fb3a1;--purple:#7a89c2;--grid:#34373f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,sans-serif;font-size:14px}
a{color:var(--gold)}
.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 70px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:2px}
.head h1{font-size:24px;margin:0;font-weight:700;letter-spacing:.3px}
.head .sub{color:var(--mut);font-size:12.5px}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:10px 0 18px;opacity:.6}
.season{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 4px 18px #0003}
.season.live{border-color:var(--gold)}
.stitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.stitle h2{margin:0;font-size:18px;font-weight:700}
.stitle .dates{color:var(--mut);font-size:11.5px}
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.5px;background:var(--gold);color:#241c08;border-radius:999px;padding:2px 9px;font-weight:700}
.pdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.pdot{animation:none}}
.champ{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:19px;font-weight:700}
.champ .pts{color:var(--mut);font-size:13px;font-weight:500}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
@media(max-width:680px){.sgrid{grid-template-columns:1fr}}
.block h3{margin:0 0 8px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stand{list-style:none;margin:0;padding:0}
.stand li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--grid);font-size:13px}
.stand li:last-child{border-bottom:none}
.stand .r{color:var(--mut);width:26px;display:inline-block;text-align:right;margin-right:8px}
.stand .p{color:var(--mut);font-size:12px}
.stand li.top .nm{color:var(--gold);font-weight:700}
.cat{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-bottom:1px solid var(--grid)}
.cat:last-child{border-bottom:none}
.cat .k{font-size:12.5px;font-weight:600}
.cat .v{font-size:12px;color:var(--ink)}
.cat .a{font-size:11px;color:var(--mut)}
/* live-season top-5 category grid */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.cblock{background:var(--panel2);border:1px solid var(--grid);border-radius:10px;padding:10px 12px}
.ch{font-size:12.5px;font-weight:700;color:var(--gold);margin-bottom:6px}
.ctrow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:2px 0}
.ctrow .cr{width:16px;color:var(--mut);flex:none;text-align:right}
.ctrow .cn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrow .cv{color:var(--mut);flex:none;font-size:11.5px}
.ctrow.win .cn{color:var(--gold);font-weight:700}
.cat-at{font-size:10.5px;color:var(--mut);margin-top:6px;border-top:1px solid var(--grid);padding-top:5px}
.ctempty{color:var(--mut);font-size:11.5px;font-style:italic;padding:4px 0}
@media(max-width:680px){.cgrid{grid-template-columns:1fr}}
.feat{font-size:12.5px;padding:4px 0;color:var(--ink)}
.feat b{color:var(--gold)}
.foot{color:var(--mut);font-size:11px;text-align:center;margin-top:26px}
/* section headings + all-time titles */
.sechead{font-size:15px;color:var(--gold);margin:6px 0 12px;letter-spacing:.3px}
.atblock{margin-bottom:26px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:14px 16px;box-shadow:0 4px 18px #0003}
.th{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--grid)}
.th .tt{font-size:16px;font-weight:700;color:var(--ink)}
.th .td{font-size:11px;color:var(--mut);width:100%}
.tem{height:1.1em;vertical-align:-0.15em}
.trow{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.trow .tr{width:20px;color:var(--mut);flex:none;text-align:right}
.trow .tn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tb{color:var(--mut);font-size:11px;flex:none}
.trow.hold .tn{color:var(--gold);font-weight:700}
.ttempty{color:var(--mut);font-size:12px;font-style:italic;padding:6px 0}
@media(max-width:760px){.tgrid{grid-template-columns:1fr}}
.loading{color:var(--mut);padding:60px;text-align:center;font-size:14px}
.err{color:var(--coral);padding:40px;text-align:center}
.emptyseason{color:var(--mut);font-size:12.5px;font-style:italic}
.clnav{display:flex;align-items:center;gap:4px;max-width:1080px;margin:0 auto;padding:14px 20px 0;flex-wrap:wrap}
.clnav .brand{font-weight:700;font-size:15px;color:var(--gold);margin-right:12px;letter-spacing:.3px}
.clnav a{color:var(--mut);text-decoration:none;font-size:13px;padding:7px 14px;border-radius:9px;font-weight:600}
.clnav a:hover{color:var(--ink)}
.clnav a.on{background:var(--gold);color:#241c08}
.clnav a.joinbtn{margin-left:auto;background:var(--gold);color:#241c08;font-weight:700}
.clnav a.joinbtn:hover{color:#241c08;filter:brightness(1.08)}

/* ---- interaction & polish pass ---- */
html{scroll-behavior:smooth}
::selection{background:var(--gold);color:#241c08}
*{-webkit-tap-highlight-color:transparent}
.clnav a{transition:background .14s ease,color .14s ease,transform .08s ease}
.clnav a:active{transform:translateY(1px)}
.clnav a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.clnav{position:sticky;top:0;z-index:50;background:#22242aef;backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--grid);padding-top:12px;padding-bottom:10px}
.loading{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<nav class="clnav"><a href="/" class="brand">Cigar Lounge</a><a href="/hof" class="on">Hall of Fame</a><a href="/lab">Stats Lab</a><a class="joinbtn" href="/join" target="_blank" rel="noopener">Apply to join</a></nav>
<div class="wrap">
  <div class="head">
    <h1>🏆 Hall of Fame</h1>
    <span class="sub" id="sub">Champions of every season</span>
  </div>
  <div class="rule"></div>
  <div id="root"><div class="loading">Summoning the champions…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emoImg = tok => { const m=String(tok||'').match(/<(a?):(\w+):(\d+)>/); return m?`<img class="tem" src="https://cdn.discordapp.com/emojis/${m[3]}.${m[1]==='a'?'gif':'png'}" alt="">`:''; };

function titlesSection(titles){
  if(!titles || !titles.length) return '';
  const cards = titles.map(t=>{
    let rows;
    if(!t.ranking || !t.ranking.length){
      rows = `<div class="ttempty">No one qualifies yet (needs ${esc(t.min_boards)}+ boards).</div>`;
    } else {
      rows = t.ranking.map(r=>{
        const cnt = r.total ? `${esc(r.boards)}/${esc(r.total)}` : `${esc(r.boards)}`;
        return `<div class="trow ${r.holder?'hold':''}"><span class="tr">${esc(r.rank)}.</span>`
          + `<span class="tn">${esc(r.name)}${r.holder?' 👑':''}</span>`
          + `<span class="tb">${cnt} boards · avg #${esc(r.avg)}</span></div>`;
      }).join('');
    }
    return `<div class="tcard"><div class="th">${emoImg(t.emoji)}<span class="tt">${esc(t.title)}</span>`
      + `<span class="td">${esc(t.desc)}</span></div>${rows}</div>`;
  }).join('');
  return `<div class="atblock"><h2 class="sechead">🏆 All-Time Titles</h2><div class="tgrid">${cards}</div></div>`;
}

function seasonCard(s){
  const live = s.in_progress;
  const dates = [s.started_at, s.ended_at||(live?'now':'')].filter(Boolean).join(' → ');
  let champHtml = '';
  if(s.gp_mode && s.champion){
    champHtml = `<div class="champ">🏆 <span>${esc(s.champion.name)}</span>`
      + `<span class="pts">${esc(s.champion.points)} pts</span></div>`;
  }
  // Standings (GP mode)
  let standHtml = '';
  if(s.gp_mode && s.standings && s.standings.length){
    const rows = s.standings.map(r =>
      `<li class="${r.rank===1?'top':''}"><span><span class="r">${r.rank}.</span>`
      + `<span class="nm">${esc(r.name)}</span></span><span class="p">${esc(r.points)} pts</span></li>`
    ).join('');
    standHtml = `<div class="block"><h3>Standings</h3><ul class="stand">${rows}</ul></div>`;
  }
  // Categories: live season shows the full top-5 per category (like the Discord board);
  // completed seasons show just the champion.
  let catHtml = '';
  if(s.categories && s.categories.length){
    if(live){
      const blocks = s.categories.map(c=>{
        const rows = (c.top && c.top.length)
          ? c.top.map((t,i)=>`<div class="ctrow ${i===0?'win':''}"><span class="cr">${i+1}.</span>`
              + `<span class="cn">${esc(t.name)}</span><span class="cv">${esc(t.value)}</span></div>`).join('')
          : '<div class="ctempty">— not enough data —</div>';
        const at = c.all_time ? `<div class="cat-at">all-time: ${esc(c.all_time.name)}${c.all_time.value?' '+esc(c.all_time.value):''}</div>` : '';
        return `<div class="cblock"><div class="ch">${esc(c.category)}</div>${rows}${at}</div>`;
      }).join('');
      catHtml = `<div class="block"><h3>Category Standings · Top 5</h3><div class="cgrid">${blocks}</div></div>`;
    }else{
      const rows = s.categories.map(c=>{
        const sv = c.season ? `${esc(c.season.name)}${c.season.value?' '+esc(c.season.value):''}` : '—';
        const av = c.all_time ? `${esc(c.all_time.name)}${c.all_time.value?' '+esc(c.all_time.value):''}` : '—';
        return `<div class="cat"><span class="k">${esc(c.category)}</span>`
          + `<span class="v">🥇 ${sv}</span><span class="a">all-time: ${av}</span></div>`;
      }).join('');
      catHtml = `<div class="block"><h3>Category Champions</h3>${rows}</div>`;
    }
  }
  // Featured
  let featHtml = '';
  if(s.featured && s.featured.length){
    const rows = s.featured.map(f=>{
      const w = f.winner ? `<b>${esc(f.winner)}</b>${f.value?' ('+esc(f.value)+')':''}` : '—';
      return `<div class="feat">✨ ${esc(f.label)} — ${esc(f.focus)}: ${w}</div>`;
    }).join('');
    featHtml = `<div class="block"><h3>Special Features</h3>${rows}</div>`;
  }
  let body;
  if(live){
    // Full-width stack: standings, then the top-5 category grid, then features.
    body = (standHtml || catHtml || featHtml)
      ? `${standHtml}${catHtml}${featHtml}`
      : `<div class="emptyseason">No results recorded for this season yet.</div>`;
  }else{
    const left = standHtml || featHtml;
    const right = catHtml + (standHtml ? featHtml : '');
    body = (left||right)
      ? `<div class="sgrid"><div>${left}</div><div>${right}</div></div>`
      : `<div class="emptyseason">No results recorded for this season yet.</div>`;
  }
  return `<div class="season ${live?'live':''}">`
    + `<div class="stitle"><h2>${esc(s.label)}</h2>`
    + (live?`<span class="badge"><span class="pdot"></span>In progress</span>`:'')
    + (dates?`<span class="dates">${esc(dates)}</span>`:'')
    + `</div>${champHtml}${body}</div>`;
}

async function load(){
  const root = document.getElementById('root');
  try{
    const r = await fetch('/hof/data', {cache:'no-store'});
    if(!r.ok) throw new Error('status '+r.status);
    const d = await r.json();
    const titles = titlesSection(d.all_time_titles);
    const hasSeasons = d.seasons && d.seasons.length;
    if(!titles && !hasSeasons){
      root.innerHTML = `<div class="loading">No titles or seasons yet. Check back after the first bounty closes.</div>`;
      return;
    }
    document.getElementById('sub').textContent =
      `${d.season_count} season${d.season_count===1?'':'s'} · ${d.gp_mode?'Grand Prix champions':'category champions'}`;
    const cur = d.seasons.filter(s=>s.in_progress);
    const past = d.seasons.filter(s=>!s.in_progress);
    let body = titles;
    if(cur.length)  body += `<h2 class="sechead">📅 Current Season</h2>` + cur.map(seasonCard).join('');
    if(past.length) body += `<h2 class="sechead">🏁 Past Seasons</h2>` + past.map(seasonCard).join('');
    root.innerHTML = body;
    document.getElementById('foot').textContent = `Cigar Lounge Butler · updated ${d.generated_at}`;
  }catch(e){
    root.innerHTML = `<div class="err">Couldn't load the Hall of Fame right now.<br><span style="color:var(--mut);font-size:12px">${esc(e.message)}</span></div>`;
  }
}
load();
</script>
</body>
</html>
