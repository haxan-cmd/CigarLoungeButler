<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cigar Lounge — Stats Lab</title>
<style>
:root{
  --bg:#22242a;--panel:#2b2d34;--panel2:#31343c;--ink:#f2f3f5;--mut:#8b8f9a;
  --gold:#e0a84c;--blue:#5b8dd9;--coral:#d85a30;--teal:#4fb3a1;--purple:#7a89c2;--grid:#34373f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,sans-serif;font-size:14px}
a{color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:2px}
.head h1{font-size:22px;margin:0;font-weight:700}
.head .sub{color:var(--mut);font-size:12.5px}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:10px 0 14px;opacity:.6}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding-left:2px}
select,input{background:var(--panel);color:var(--ink);border:1px solid var(--grid);border-radius:8px;padding:6px 9px;font-size:12.5px;font-family:inherit;min-width:96px}
select:focus,input:focus{outline:1px solid var(--gold)}
.cbox{position:relative}
.cbox input{width:100%}
.cblist{position:absolute;top:100%;left:0;right:0;z-index:40;background:var(--panel2);border:1px solid var(--grid);border-radius:8px;margin-top:3px;max-height:260px;overflow-y:auto;box-shadow:0 10px 26px #000a}
.cbitem{padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.cbitem:hover{background:var(--panel)}
.cbitem.sel{color:var(--gold)}
.btn{background:var(--panel);border:1px solid var(--grid);border-radius:8px;color:var(--mut);padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{color:var(--ink)}
.tabs{display:inline-flex;border:1px solid var(--grid);border-radius:10px;overflow:hidden;margin-bottom:14px}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;color:var(--mut);background:var(--panel);border:none;font-family:inherit}
.tab.on{background:var(--gold);color:#241c08;font-weight:700}
.card{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--grid);border-radius:999px;padding:5px 11px;font-size:11.5px;color:var(--mut);cursor:pointer;user-select:none}
.chip.on{background:var(--panel2);color:var(--ink);border-color:var(--gold)}
/* matrix */
.mtx{display:grid;gap:3px;overflow-x:auto}
.mcell{aspect-ratio:1;min-width:44px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#12141a;cursor:pointer}
.mcell.lab{background:none!important;color:var(--mut);font-size:10px;font-weight:600;cursor:default;justify-content:flex-end;padding-right:4px;text-align:right}
.mcell.labtop{writing-mode:vertical-rl;transform:rotate(180deg);justify-content:flex-start;align-items:flex-start}
.mcell.diag{background:var(--gold)!important;color:#241c08}
.mcell:hover{outline:2px solid var(--ink)}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--mut);margin-top:10px;flex-wrap:wrap}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
/* scatter */
#scWrap{position:relative}
canvas{display:block;width:100%;border-radius:8px}
.rbox{position:absolute;top:10px;right:12px;background:#12141a;border:1px solid var(--grid);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
.slegend{position:absolute;top:10px;left:12px;font-size:11px;color:var(--mut);background:#12141acc;border-radius:8px;padding:6px 8px}
.slegend div{margin:2px 0}
.tip{position:fixed;pointer-events:none;background:#12141a;border:1px solid var(--grid);border-radius:7px;padding:6px 9px;font-size:11.5px;opacity:0;transition:.06s;z-index:60;white-space:nowrap}
/* compare */
.cmp .row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin-bottom:14px}
.cmp .k{font-size:12.5px;color:var(--ink);text-align:right}
.cmp .bars{display:flex;flex-direction:column;gap:4px}
.cmp .brow{display:flex;align-items:center;gap:8px;font-size:11px}
.cmp .bx{height:11px;border-radius:3px;min-width:2px}
.foot{color:var(--mut);font-size:11px;text-align:right;margin-top:8px}
.loading{color:var(--mut);padding:40px;text-align:center}
.hide{display:none}
@media(max-width:640px){
  .wrap{padding:10px 10px 46px}
  .head h1{font-size:17px}
  .head{gap:6px}
  .bar{gap:6px}
  .f{flex:1 1 44%}
  .cbox input,select{min-width:0;width:100%}
  .tab{padding:7px 9px;font-size:12px}
  .tabs{flex-wrap:wrap}
  .cblist{max-height:200px}
  .cmp .row{grid-template-columns:70px 1fr;gap:6px}
  .cmp .k{font-size:11px}
  .card{padding:12px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🎲 Cigar Lounge — Stats Lab</h1>
    <span class="sub" id="sub">loading…</span>
  </div>
  <div class="rule"></div>

  <div class="bar" id="filters"></div>

  <div class="tabs" id="tabs">
    <button class="tab" data-v="matrix">🔲 Matrix</button>
    <button class="tab" data-v="scatter">📊 Scatter</button>
    <button class="tab" data-v="compare">⚔️ Compare</button>
    <button class="tab" data-v="trends">📈 Trends</button>
    <button class="tab" data-v="galaxy">🌌 Galaxy</button>
  </div>

  <div id="view"><div class="loading">Fetching the vault…</div></div>
  <div class="foot" id="foot"></div>
</div>
<div class="tip" id="tip"></div>

<script>
const PALETTE=['#e0a84c','#5b8dd9','#d85a30','#4fb3a1','#7a89c2','#e0729b','#8bd3dd','#b5e48c','#f4a259'];
const FACTION_COL={Agatha:'#5b8dd9',Mason:'#d84343',Tenosia:'#e0a84c'};
const GRIP_COL={'1H':'#5b8dd9','2H':'#e0a84c'};
const LABELS={kills:'Kills',td:'Takedowns',deaths:'Deaths',kd:'K/D ratio',
  aggression:'Aggression (K+D)',kill_share:'Kill share %',team_td_share:'Team TD share %',
  warlord:'Warlord %',lethality:'Lethality (K/TD)',score:'Score',
  lobby_kills:'Total lobby kills',tilt:'Lobby kill gap'};
const ALL_STATS=Object.keys(LABELS);
const DEFAULT_MATRIX=['kills','td','deaths','kd','kill_share','warlord','tilt'];

const qp=new URLSearchParams(location.search);
const TOKEN=qp.get('t')||'';
let FIELDS=[], IDX={}, DATA=[];
let matrixStats=DEFAULT_MATRIX.slice();
const state={
  view:qp.get('view')||'matrix',
  x:qp.get('x')||'td', y:qp.get('y')||'kills', colour:qp.get('colour')||'',
  group:'grip', compareStats:['kills','td','deaths','kd','kill_share','warlord'], compareMin:3, compareScale:'prop',
  trend:{stat:'kill_share',period:'week',split:''},
  galaxy:{x:'aggression',y:'kill_share',colour:'cls',min:10},
  filters:{player:qp.get('player')||'',weapon:qp.get('weapon')||'',cls:qp.get('class')||'',
           grip:qp.get('grip')||'',faction:qp.get('faction')||'',map:qp.get('map')||'',side:qp.get('side')||'',vip:qp.get('vip')||''}
};

function val(rec,key){return rec[IDX[key]];}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pearson(pairs){
  const n=pairs.length; if(n<3) return null;
  let mx=0,my=0; for(const p of pairs){mx+=p[0];my+=p[1];} mx/=n;my/=n;
  let sxx=0,syy=0,sxy=0;
  for(const p of pairs){const dx=p[0]-mx,dy=p[1]-my;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy;}
  if(sxx<=0||syy<=0) return null;
  return {r:sxy/Math.sqrt(sxx*syy),m:sxy/sxx,b:my-(sxy/sxx)*mx};
}
function uniques(key){
  const s=new Set();
  for(const r of DATA){const v=r[IDX[key]]; if(v) s.add(v);}
  return [...s].sort();
}
function filtered(){
  const f=state.filters;
  return DATA.filter(r=>{
    if(f.player && (r[IDX.name]||'')!==f.player && (r[IDX.did]||'')!==f.player) return false;
    if(f.weapon && (r[IDX.weapon]||'')!==f.weapon) return false;
    if(f.cls && (r[IDX.cls]||'')!==f.cls) return false;
    if(f.grip && (r[IDX.grip]||'')!==f.grip) return false;
    if(f.faction && (r[IDX.faction]||'')!==f.faction) return false;
    if(f.map && (r[IDX.map]||'')!==f.map) return false;
    if(f.side && (r[IDX.side]||'')!==f.side) return false;
    if(f.vip && (r[IDX.vip]||'')!==f.vip) return false;
    return true;
  });
}
function activeBits(){
  const f=state.filters, out=[];
  for(const [k,lab] of [['player','Player'],['weapon','Weapon'],['cls','Class'],['grip','Weapon Type'],['faction','Faction'],['map','Map'],['side','Side']])
    if(f[k]) out.push(f[k]);
  return out;
}

// ---- filters UI ----
function searchSelect(label,options,current,cb,width){
  const wrap=document.createElement('div'); wrap.className='f';
  const l=document.createElement('label'); l.textContent=label; wrap.appendChild(l);
  const box=document.createElement('div'); box.className='cbox';
  const input=document.createElement('input'); input.type='text'; input.placeholder='all';
  input.autocomplete='off'; input.value=current||''; if(width) input.style.minWidth=width+'px';
  const list=document.createElement('div'); list.className='cblist hide';
  let cur=current||''; const all=['',...options];
  function draw(f){
    list.innerHTML=''; const q=(f||'').toLowerCase();
    all.filter(o=>o===''||o.toLowerCase().includes(q)).slice(0,300).forEach(o=>{
      const it=document.createElement('div'); it.className='cbitem'+(o===cur?' sel':'');
      it.textContent=o===''?'all':o;
      it.addEventListener('mousedown',e=>{e.preventDefault();cur=o;input.value=o;list.classList.add('hide');input.blur();cb(o);});
      list.appendChild(it);
    });
  }
  input.addEventListener('focus',()=>{input.value='';draw('');list.classList.remove('hide');});
  input.addEventListener('input',()=>draw(input.value));
  input.addEventListener('blur',()=>setTimeout(()=>{list.classList.add('hide');input.value=cur;},120));
  box.appendChild(input); box.appendChild(list); wrap.appendChild(box);
  return wrap;
}
function buildFilters(){
  const bar=document.getElementById('filters'); bar.innerHTML='';
  const defs=[['player','Player','name',190],['weapon','Weapon','weapon',150],['cls','Class','cls',110],
    ['grip','Weapon Type','grip',130],['faction','Faction','faction',120],['map','Map','map',140],['side','Side','side',110],['vip','VIP','vip',100]];
  for(const [fk,lab,uk,w] of defs){
    bar.appendChild(searchSelect(lab, uniques(uk), state.filters[fk]||'',
      v=>{state.filters[fk]=v;render();}, w));
  }
  const reset=document.createElement('button'); reset.className='btn'; reset.textContent='Reset';
  reset.style.alignSelf='flex-end';
  reset.addEventListener('click',()=>{for(const k in state.filters)state.filters[k]='';buildFilters();render();});
  bar.appendChild(reset);
}

// ---- matrix ----
function divColor(r){
  const a=Math.min(1,Math.abs(r));
  const c=r>=0?[79,179,161]:[216,90,48], bg=[43,45,52];
  return 'rgb('+c.map((x,i)=>Math.round(bg[i]+(x-bg[i])*(0.15+0.85*a))).join(',')+')';
}
function renderMatrix(){
  const rows=filtered();
  const keys=matrixStats, n=keys.length;
  const vals={}; for(const k of keys) vals[k]=rows.map(r=>val(r,k));
  const view=document.getElementById('view');
  view.innerHTML='';
  // stat chips
  const chipCard=document.createElement('div'); chipCard.className='card';
  chipCard.innerHTML='<h3>Stats in the matrix — click to toggle</h3>';
  const chips=document.createElement('div'); chips.className='chips';
  for(const k of ALL_STATS){
    const c=document.createElement('span'); c.className='chip'+(keys.includes(k)?' on':'');
    c.textContent=LABELS[k];
    c.addEventListener('click',()=>{
      const i=matrixStats.indexOf(k);
      if(i>=0){ if(matrixStats.length>2) matrixStats.splice(i,1); }
      else matrixStats.push(k);
      renderMatrix();
    });
    chips.appendChild(c);
  }
  chipCard.appendChild(chips); view.appendChild(chipCard);

  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<h3>Correlation matrix — click a cell to drill into that scatter</h3>';
  const mtx=document.createElement('div'); mtx.className='mtx';
  mtx.style.gridTemplateColumns='minmax(70px,auto) repeat('+n+',minmax(44px,1fr))';
  const tip=document.getElementById('tip');
  const corner=document.createElement('div'); corner.className='mcell lab'; mtx.appendChild(corner);
  for(const k of keys){const d=document.createElement('div');d.className='mcell lab labtop';d.textContent=LABELS[k];mtx.appendChild(d);}
  for(let i=0;i<n;i++){
    const rl=document.createElement('div'); rl.className='mcell lab'; rl.textContent=LABELS[keys[i]]; mtx.appendChild(rl);
    for(let j=0;j<n;j++){
      const c=document.createElement('div');
      if(i===j){c.className='mcell diag';c.textContent='1';mtx.appendChild(c);continue;}
      const pairs=[]; for(let t=0;t<rows.length;t++){const a=vals[keys[i]][t],b=vals[keys[j]][t]; if(a!=null&&b!=null)pairs.push([a,b]);}
      const res=pairs.length>=5?pearson(pairs):null;
      c.className='mcell';
      if(!res){c.style.background='#3a3d45';c.style.color='#8b8f9a';c.textContent='·';}
      else{c.style.background=divColor(res.r);c.style.color='#f2f3f5';c.textContent=(res.r>=0?'+':'')+res.r.toFixed(2).replace(/^(-?)0/,'$1');}
      const A=keys[i],B=keys[j],R=res;
      c.addEventListener('mousemove',e=>{tip.textContent=LABELS[A]+' × '+LABELS[B]+(R?('  r='+(R.r>=0?'+':'')+R.r.toFixed(2)+' · '+pairs.length+' runs'):'  (too few runs)');tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';});
      c.addEventListener('mouseleave',()=>tip.style.opacity=0);
      c.addEventListener('click',()=>{state.x=B;state.y=A;setView('scatter');});
      mtx.appendChild(c);
    }
  }
  card.appendChild(mtx);
  const leg=document.createElement('div'); leg.className='legend';
  leg.innerHTML='<span><span class="sw" style="background:var(--teal)"></span>move together</span><span><span class="sw" style="background:var(--coral)"></span>pull apart</span><span><span class="sw" style="background:var(--gold)"></span>self</span><span>· = too few runs</span>';
  card.appendChild(leg); view.appendChild(card);
}

// ---- scatter ----
function catOf(r){
  const ck=state.colour;
  if(!ck) return null;
  if(ck==='weapon')return r[IDX.weapon]||'—';
  if(ck==='class')return r[IDX.cls]||'—';
  if(ck==='subclass')return r[IDX.subclass]||'—';
  if(ck==='grip')return r[IDX.grip]||'—';
  if(ck==='vip')return r[IDX.vip]||'—';
  return r[IDX.faction]||'—';
}
function renderScatter(){
  const rows=filtered();
  const view=document.getElementById('view'); view.innerHTML='';
  const ctrl=document.createElement('div'); ctrl.className='bar';
  ctrl.appendChild(statSelect('X axis',state.x,v=>{state.x=v;renderScatter();}));
  ctrl.appendChild(statSelect('Y axis',state.y,v=>{state.y=v;renderScatter();}));
  ctrl.appendChild(pickSelect('Colour by',[['','none'],['weapon','Weapon'],['class','Class'],['subclass','Subclass'],['grip','Grip'],['faction','Faction']],state.colour,v=>{state.colour=v;renderScatter();}));
  view.appendChild(ctrl);

  const pts=[];
  for(const r of rows){const x=val(r,state.x),y=val(r,state.y); if(x!=null&&y!=null)pts.push({x,y,cat:catOf(r),name:r[IDX.name],w:r[IDX.weapon]});}
  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<h3>'+LABELS[state.x]+' vs '+LABELS[state.y]+' · '+pts.length+' runs</h3>';
  if(pts.length<5){card.innerHTML+='<div class="loading">Not enough runs — widen the filters.</div>';view.appendChild(card);return;}
  const wrap=document.createElement('div'); wrap.id='scWrap';
  const cv=document.createElement('canvas'); wrap.appendChild(cv); card.appendChild(wrap); view.appendChild(card);
  drawScatter(cv,wrap,pts);
}
function drawScatter(cv,wrap,pts){
  const W=cv.clientWidth||900, H=Math.round(W*0.52);
  const dpr=window.devicePixelRatio||1; cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  const g=cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  const pad={l:52,r:16,t:16,b:36};
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  const sx=v=>pad.l+(v-xmin)/((xmax-xmin)||1)*(W-pad.l-pad.r);
  const sy=v=>H-pad.b-(v-ymin)/((ymax-ymin)||1)*(H-pad.t-pad.b);
  // axes
  g.strokeStyle='#34373f'; g.lineWidth=1; g.fillStyle='#8b8f9a'; g.font='11px Poppins,sans-serif';
  for(let i=0;i<=4;i++){const t=i/4;
    const yv=ymin+(ymax-ymin)*t, xv=xmin+(xmax-xmin)*t;
    const yy=sy(yv), xx=sx(xv);
    g.globalAlpha=.5;g.beginPath();g.moveTo(pad.l,yy);g.lineTo(W-pad.r,yy);g.stroke();g.globalAlpha=1;
    g.fillText(fmt(yv),6,yy+4); g.fillText(fmt(xv),xx-8,H-pad.b+16);
  }
  // colour groups
  let colFn=()=>'#e0a84c', legend=null;
  if(state.colour){
    const cats=[...new Set(pts.map(p=>p.cat))];
    const freq={}; pts.forEach(p=>freq[p.cat]=(freq[p.cat]||0)+1);
    const keep=cats.sort((a,b)=>freq[b]-freq[a]).slice(0,8);
    const cmap={}; keep.forEach((c,i)=>cmap[c]=PALETTE[i%PALETTE.length]);
    if(state.colour==='faction')keep.forEach(c=>{if(FACTION_COL[c])cmap[c]=FACTION_COL[c];});
    if(state.colour==='grip')keep.forEach(c=>{if(GRIP_COL[c])cmap[c]=GRIP_COL[c];});
    colFn=p=>cmap[p.cat]||'#8a8f98'; legend=keep.map(c=>[c,cmap[c]]);
  }
  // trend + r
  const res=pearson(pts.map(p=>[p.x,p.y]));
  // points
  const screen=[];
  for(const p of pts){const px=sx(p.x),py=sy(p.y);screen.push({px,py,p});
    g.beginPath();g.arc(px,py,3.4,0,7);g.fillStyle=colFn(p);g.globalAlpha=.85;g.fill();g.globalAlpha=1;}
  if(res){g.strokeStyle='#d85a30';g.lineWidth=2.2;g.globalAlpha=.9;g.beginPath();
    g.moveTo(sx(xmin),sy(res.m*xmin+res.b));g.lineTo(sx(xmax),sy(res.m*xmax+res.b));g.stroke();g.globalAlpha=1;}
  // r box
  const rb=document.createElement('div'); rb.className='rbox';
  if(res){const mag=Math.abs(res.r);const strength=mag<.15?'no':mag<.4?'weak':mag<.7?'moderate':'strong';
    const dir=mag<.15?'':(res.r>0?' positive':' negative');
    rb.style.color=res.r>=0?'#4fb3a1':'#d85a30'; rb.textContent='r = '+(res.r>=0?'+':'')+res.r.toFixed(2)+'  ('+strength+dir+')';}
  else rb.textContent='r = n/a';
  wrap.appendChild(rb);
  if(legend){const lg=document.createElement('div');lg.className='slegend';
    lg.innerHTML=legend.map(([c,col])=>'<div><span class="sw" style="background:'+col+'"></span>'+esc(c)+'</div>').join('');
    wrap.appendChild(lg);}
  // hover
  const tip=document.getElementById('tip');
  cv.onmousemove=e=>{const rect=cv.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    let best=null,bd=1e9;
    for(const s of screen){const d=(s.px-mx)**2+(s.py-my)**2; if(d<bd){bd=d;best=s;}}
    if(best&&bd<160){tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';
      tip.textContent=(best.p.name||'?')+' · '+(best.p.w||'?')+' · '+LABELS[state.x]+' '+fmt(best.p.x)+' / '+LABELS[state.y]+' '+fmt(best.p.y);}
    else tip.style.opacity=0;};
  cv.onmouseleave=()=>tip.style.opacity=0;
}
function fmt(v){return Math.abs(v)>=100?Math.round(v):(Math.round(v*100)/100);}

// ---- compare ----
function renderCompare(){
  const rows=filtered();
  const view=document.getElementById('view'); view.innerHTML='';
  const ctrl=document.createElement('div'); ctrl.className='bar';
  ctrl.appendChild(pickSelect('Group by',[['grip','Weapon Type (1H/2H)'],['class','Class'],['faction','Faction'],['side','Side (attack/def)'],['vip','VIP status'],['weapon','Weapon'],['subclass','Subclass']],state.group,v=>{state.group=v;renderCompare();}));
  ctrl.appendChild(pickSelect('Min runs',[['1','1+'],['3','3+'],['5','5+'],['10','10+']],String(state.compareMin),v=>{state.compareMin=+v;renderCompare();}));
  ctrl.appendChild(pickSelect('Bar scale',[['prop','Proportional'],['spread','Spread']],state.compareScale,v=>{state.compareScale=v;renderCompare();}));
  view.appendChild(ctrl);
  // stat picker
  const chipCard=document.createElement('div'); chipCard.className='card';
  chipCard.innerHTML='<h3>Stats to compare — click to toggle</h3>';
  const chips=document.createElement('div'); chips.className='chips';
  for(const k of ALL_STATS){
    const c=document.createElement('span'); c.className='chip'+(state.compareStats.includes(k)?' on':''); c.textContent=LABELS[k];
    c.addEventListener('click',()=>{const i=state.compareStats.indexOf(k); if(i>=0){if(state.compareStats.length>1)state.compareStats.splice(i,1);} else state.compareStats.push(k); renderCompare();});
    chips.appendChild(c);
  }
  chipCard.appendChild(chips); view.appendChild(chipCard);

  const keys=state.compareStats;
  const gk={grip:'grip',class:'cls',faction:'faction',side:'side',vip:'vip',weapon:'weapon',subclass:'subclass'}[state.group];
  const acc={};
  for(const r of rows){const gv=r[IDX[gk]]; if(!gv)continue;
    const a=acc[gv]||(acc[gv]={n:0}); a.n++;
    for(const k of keys){const v=val(r,k); if(v!=null){a[k]=(a[k]||0)+v; a[k+'_n']=(a[k+'_n']||0)+1;}}}
  let groups=Object.keys(acc).filter(g=>acc[g].n>=state.compareMin);
  const order={grip:['1H','2H'],class:['Knight','Vanguard','Footman','Archer'],faction:['Agatha','Mason','Tenosia'],side:['Attack','Defense'],vip:['VIP','Non-VIP']}[state.group]||[];
  groups.sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||acc[b].n-acc[a].n;});
  if(state.group==='weapon'||state.group==='subclass') groups=groups.sort((a,b)=>acc[b].n-acc[a].n).slice(0,8);
  const cmap={}; groups.forEach((g,i)=>{cmap[g]=PALETTE[i%PALETTE.length];
    if(state.group==='faction'&&FACTION_COL[g])cmap[g]=FACTION_COL[g];
    if(state.group==='grip'&&GRIP_COL[g])cmap[g]=GRIP_COL[g];});
  const titleMap={grip:'One hand vs two',class:'Class by class',faction:'Faction by faction',side:'Attack vs defence',vip:'VIP vs non-VIP',weapon:'Weapon by weapon',subclass:'Subclass by subclass'};
  const base=groups[0];
  const card=document.createElement('div'); card.className='card cmp';
  card.innerHTML='<h3>'+(titleMap[state.group]||'Compare')+' · '+rows.length+' runs'+(base?(' · bars '+(state.compareScale==='spread'?'scaled to the spread':'proportional')+' · % vs '+esc(base)):'')+'</h3>';
  if(groups.length<2){card.innerHTML+='<div class="loading">Only '+groups.length+' group meets the run threshold — lower Min runs, change the grouping, or widen the filters.</div>';view.appendChild(card);return;}
  const leg=document.createElement('div'); leg.className='chips';
  leg.innerHTML=groups.map(g=>'<span class="chip on"><span class="sw" style="background:'+cmap[g]+'"></span>'+esc(g)+' (n='+acc[g].n+')'+(acc[g].n<10?' · low':'')+'</span>').join('');
  card.appendChild(leg);
  for(const k of keys){
    const avgs=groups.map(g=>acc[g][k+'_n']?acc[g][k]/acc[g][k+'_n']:null);
    const present=avgs.filter(v=>v!=null);
    if(!present.length) continue;
    const vmin=Math.min(...present), vmax=Math.max(...present), rng=(vmax-vmin)||1;
    const absmax=Math.max(...present.map(Math.abs),1e-9);
    const baseVal=acc[base][k+'_n']?acc[base][k]/acc[base][k+'_n']:null;
    const row=document.createElement('div'); row.className='row';
    const kk=document.createElement('div'); kk.className='k'; kk.textContent=LABELS[k]; row.appendChild(kk);
    const bars=document.createElement('div'); bars.className='bars';
    groups.forEach((g,i)=>{const v=avgs[i]; const nContrib=acc[g][k+'_n']||0;
      const br=document.createElement('div'); br.className='brow';
      const bx=document.createElement('span'); bx.className='bx';
      if(v==null){bx.style.width='3px';bx.style.background='#4a4d55';br.appendChild(bx);
        const t=document.createElement('span');t.style.color='#8b8f9a';t.textContent='—  (0 runs)';br.appendChild(t);bars.appendChild(br);return;}
      const frac=(state.compareScale==='spread')?(0.12+0.88*(v-vmin)/rng):(Math.abs(v)/absmax);
      bx.style.width=(Math.max(0.6,frac*100))+'%'; bx.style.background=cmap[g];
      br.appendChild(bx);
      const t=document.createElement('span'); t.style.color='#f2f3f5';
      let txt=''+(Math.round(v*100)/100);
      if(baseVal!=null && g!==base && baseVal!==0){const d=Math.round((v-baseVal)/Math.abs(baseVal)*100); txt+='  '+(d>=0?'+':'')+d+'%';}
      const low=document.createElement('span'); low.style.color='#8b8f9a'; low.style.fontSize='10px';
      low.textContent = (nContrib<state.compareMin||nContrib<10) ? ('  ·'+nContrib+'n'+(nContrib<state.compareMin?' low':'')) : '';
      t.textContent=txt; br.appendChild(t); if(low.textContent) br.appendChild(low);
      bars.appendChild(br);});
    row.appendChild(bars); card.appendChild(row);
  }
  view.appendChild(card);
}

// ---- trends ----
function periodKey(ts,period){
  if(!ts) return null;
  const d=ts.slice(0,10);
  if(period==='month') return ts.slice(0,7);
  const dt=new Date(d+'T00:00:00Z'); if(isNaN(dt)) return null;
  const day=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-day);
  return dt.toISOString().slice(0,10);
}
function renderTrends(){
  const rows=filtered();
  const view=document.getElementById('view'); view.innerHTML='';
  const ctrl=document.createElement('div'); ctrl.className='bar';
  ctrl.appendChild(statSelect('Stat',state.trend.stat,v=>{state.trend.stat=v;renderTrends();}));
  ctrl.appendChild(pickSelect('Period',[['week','Weekly'],['month','Monthly']],state.trend.period,v=>{state.trend.period=v;renderTrends();}));
  ctrl.appendChild(pickSelect('Split by',[['','None (server)'],['cls','Class'],['grip','Weapon Type'],['faction','Faction'],['vip','VIP status']],state.trend.split,v=>{state.trend.split=v;renderTrends();}));
  view.appendChild(ctrl);
  const stat=state.trend.stat, period=state.trend.period, split=state.trend.split;
  const buckets={}, groupsSet=new Set();
  for(const r of rows){
    const v=val(r,stat); if(v==null) continue;
    const pk=periodKey(r[IDX.ts],period); if(!pk) continue;
    const g=split?(r[IDX[split]]||'—'):'all'; groupsSet.add(g);
    const b=buckets[pk]||(buckets[pk]={}); const e=b[g]||(b[g]=[0,0]); e[0]+=v; e[1]++;
  }
  const periods=Object.keys(buckets).sort();
  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<h3>'+LABELS[stat]+' over time · '+(period==='week'?'weekly':'monthly')+' · '+rows.length+' runs</h3>';
  if(periods.length<2){card.innerHTML+='<div class="loading">Not enough time range yet — widen the filters.</div>';view.appendChild(card);return;}
  let groups=[...groupsSet];
  if(split){
    const cnt={}; for(const pk of periods) for(const g in buckets[pk]) cnt[g]=(cnt[g]||0)+buckets[pk][g][1];
    groups=groups.filter(g=>g!=='—').sort((a,b)=>cnt[b]-cnt[a]).slice(0,6);
  }
  const cmap={}; groups.forEach((g,i)=>{cmap[g]=PALETTE[i%PALETTE.length];
    if(split==='faction'&&FACTION_COL[g])cmap[g]=FACTION_COL[g];
    if(split==='grip'&&GRIP_COL[g])cmap[g]=GRIP_COL[g];});
  const wrap=document.createElement('div'); wrap.id='scWrap'; const cv=document.createElement('canvas'); wrap.appendChild(cv); card.appendChild(wrap); view.appendChild(card);
  drawTrends(cv,wrap,periods,groups,cmap,buckets,split);
}
function drawTrends(cv,wrap,periods,groups,cmap,buckets,split){
  const W=cv.clientWidth||900,H=Math.round((W||900)*0.5);
  const dpr=window.devicePixelRatio||1; cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
  const g=cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  const pad={l:54,r:16,t:16,b:46};
  const series={}; let ymin=Infinity,ymax=-Infinity;
  groups.forEach(gr=>{series[gr]=periods.map(pk=>{const e=buckets[pk][gr]; if(e&&e[1]>=3){const v=e[0]/e[1]; if(v<ymin)ymin=v; if(v>ymax)ymax=v; return v;} return null;});});
  if(!isFinite(ymin)){ymin=0;ymax=1;} if(ymin===ymax){ymax=ymin+1;}
  const n=periods.length;
  const sx=i=>pad.l+(n<=1?0:i/(n-1))*(W-pad.l-pad.r);
  const sy=v=>H-pad.b-(v-ymin)/((ymax-ymin)||1)*(H-pad.t-pad.b);
  g.strokeStyle='#34373f'; g.fillStyle='#8b8f9a'; g.font='11px Poppins,sans-serif';
  for(let i=0;i<=4;i++){const yv=ymin+(ymax-ymin)*i/4, yy=sy(yv);
    g.globalAlpha=.5;g.beginPath();g.moveTo(pad.l,yy);g.lineTo(W-pad.r,yy);g.stroke();g.globalAlpha=1;g.fillText(fmt(yv),6,yy+4);}
  const step=Math.max(1,Math.ceil(n/8));
  for(let i=0;i<n;i++){ if(i%step&&i!==n-1) continue; g.save();g.translate(sx(i),H-pad.b+14);g.rotate(-0.5);g.fillText(periods[i].slice(2),0,0);g.restore(); }
  const screen=[];
  groups.forEach(gr=>{
    g.strokeStyle=cmap[gr]; g.lineWidth=2.2; g.beginPath(); let started=false;
    series[gr].forEach((v,i)=>{ if(v==null){started=false;return;} const px=sx(i),py=sy(v);
      if(!started){g.moveTo(px,py);started=true;} else g.lineTo(px,py); screen.push({px,py,gr,v,pk:periods[i]});});
    g.stroke();
    g.fillStyle=cmap[gr]; series[gr].forEach((v,i)=>{if(v==null)return;g.beginPath();g.arc(sx(i),sy(v),3,0,7);g.fill();});
  });
  if(split){const lg=document.createElement('div');lg.className='slegend';
    lg.innerHTML=groups.map(gr=>'<div><span class="sw" style="background:'+cmap[gr]+'"></span>'+esc(gr)+'</div>').join('');wrap.appendChild(lg);}
  const tip=document.getElementById('tip');
  cv.onmousemove=e=>{const rect=cv.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    let best=null,bd=1e9; for(const s of screen){const d=(s.px-mx)**2+(s.py-my)**2; if(d<bd){bd=d;best=s;}}
    if(best&&bd<200){tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';
      tip.textContent=best.pk+(split?(' · '+best.gr):'')+' · '+LABELS[state.trend.stat]+' '+fmt(best.v);}
    else tip.style.opacity=0;};
  cv.onmouseleave=()=>tip.style.opacity=0;
}

// ---- galaxy (players as points in a playstyle space) ----
function renderGalaxy(){
  const rows=filtered();
  const view=document.getElementById('view'); view.innerHTML='';
  const ctrl=document.createElement('div'); ctrl.className='bar';
  ctrl.appendChild(statSelect('X axis',state.galaxy.x,v=>{state.galaxy.x=v;renderGalaxy();}));
  ctrl.appendChild(statSelect('Y axis',state.galaxy.y,v=>{state.galaxy.y=v;renderGalaxy();}));
  ctrl.appendChild(pickSelect('Colour by',[['cls','Class'],['grip','Weapon Type'],['faction','Faction']],state.galaxy.colour,v=>{state.galaxy.colour=v;renderGalaxy();}));
  ctrl.appendChild(pickSelect('Min runs',[['5','5+'],['10','10+'],['20','20+'],['40','40+']],String(state.galaxy.min),v=>{state.galaxy.min=+v;renderGalaxy();}));
  view.appendChild(ctrl);
  const agg={};
  for(const r of rows){
    const name=r[IDX.name]||''; if(!name) continue;
    const key=(r[IDX.did]||'')||('name:'+name.toLowerCase());
    const a=agg[key]||(agg[key]={name:name,n:0,x:[0,0],y:[0,0],cats:{}});
    a.name=name; a.n++;
    const xv=val(r,state.galaxy.x), yv=val(r,state.galaxy.y);
    if(xv!=null){a.x[0]+=xv;a.x[1]++;} if(yv!=null){a.y[0]+=yv;a.y[1]++;}
    const c=r[IDX[state.galaxy.colour]]||'—'; a.cats[c]=(a.cats[c]||0)+1;
  }
  const pts=[];
  for(const k in agg){const a=agg[k]; if(a.n<state.galaxy.min||!a.x[1]||!a.y[1])continue;
    const cat=Object.keys(a.cats).sort((x,y)=>a.cats[y]-a.cats[x])[0];
    pts.push({name:a.name,n:a.n,x:a.x[0]/a.x[1],y:a.y[0]/a.y[1],cat});}
  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<h3>The playstyle galaxy · '+LABELS[state.galaxy.x]+' vs '+LABELS[state.galaxy.y]+' · '+pts.length+' players (each dot = a player)</h3>';
  if(pts.length<3){card.innerHTML+='<div class="loading">Not enough players at this run threshold — lower Min runs or widen filters.</div>';view.appendChild(card);return;}
  const wrap=document.createElement('div'); wrap.id='scWrap'; const cv=document.createElement('canvas'); wrap.appendChild(cv); card.appendChild(wrap); view.appendChild(card);
  drawGalaxy(cv,wrap,pts);
}
function drawGalaxy(cv,wrap,pts){
  const W=cv.clientWidth||900,H=Math.round((W||900)*0.62);
  const dpr=window.devicePixelRatio||1; cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
  const g=cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  const pad={l:54,r:16,t:16,b:38};
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  const xr=(xmax-xmin)*0.06||1,yr=(ymax-ymin)*0.06||1; xmin-=xr;xmax+=xr;ymin-=yr;ymax+=yr;
  const sx=v=>pad.l+(v-xmin)/((xmax-xmin)||1)*(W-pad.l-pad.r);
  const sy=v=>H-pad.b-(v-ymin)/((ymax-ymin)||1)*(H-pad.t-pad.b);
  const med=arr=>{const s=[...arr].sort((a,b)=>a-b);return s[Math.floor(s.length/2)];};
  const cx=med(xs),cy=med(ys);
  g.strokeStyle='#34373f';g.setLineDash([4,4]);g.globalAlpha=.7;
  g.beginPath();g.moveTo(sx(cx),pad.t);g.lineTo(sx(cx),H-pad.b);g.stroke();
  g.beginPath();g.moveTo(pad.l,sy(cy));g.lineTo(W-pad.r,sy(cy));g.stroke();
  g.setLineDash([]);g.globalAlpha=1;
  g.fillStyle='#8b8f9a';g.font='11px Poppins,sans-serif';
  for(let i=0;i<=4;i++){const t=i/4;g.fillText(fmt(ymin+(ymax-ymin)*t),6,sy(ymin+(ymax-ymin)*t)+4);g.fillText(fmt(xmin+(xmax-xmin)*t),sx(xmin+(xmax-xmin)*t)-8,H-pad.b+16);}
  const cats=[...new Set(pts.map(p=>p.cat))];
  const freq={};pts.forEach(p=>freq[p.cat]=(freq[p.cat]||0)+1);
  const keep=cats.sort((a,b)=>freq[b]-freq[a]).slice(0,8);
  const cmap={};keep.forEach((c,i)=>cmap[c]=PALETTE[i%PALETTE.length]);
  if(state.galaxy.colour==='faction')keep.forEach(c=>{if(FACTION_COL[c])cmap[c]=FACTION_COL[c];});
  if(state.galaxy.colour==='grip')keep.forEach(c=>{if(GRIP_COL[c])cmap[c]=GRIP_COL[c];});
  const col=p=>cmap[p.cat]||'#8a8f98';
  const maxn=Math.max(...pts.map(p=>p.n));
  const screen=[];
  for(const p of pts){const px=sx(p.x),py=sy(p.y),rad=4+6*Math.sqrt(p.n/maxn);
    g.beginPath();g.arc(px,py,rad,0,7);g.fillStyle=col(p);g.globalAlpha=.82;g.fill();g.globalAlpha=1;screen.push({px,py,rad,p});}
  const labelled=[...pts].sort((a,b)=>b.n-a.n).slice(0,8);
  g.fillStyle='#f2f3f5';g.font='11px Poppins,sans-serif';
  for(const p of labelled){g.fillText(p.name,sx(p.x)+7,sy(p.y)+3);}
  const lg=document.createElement('div');lg.className='slegend';
  lg.innerHTML=keep.map(c=>'<div><span class="sw" style="background:'+cmap[c]+'"></span>'+esc(c)+'</div>').join('');wrap.appendChild(lg);
  const tip=document.getElementById('tip');
  cv.onmousemove=e=>{const rect=cv.getBoundingClientRect();const mxp=e.clientX-rect.left,myp=e.clientY-rect.top;
    let best=null,bd=1e9;for(const s of screen){const d=(s.px-mxp)**2+(s.py-myp)**2;if(d<bd){bd=d;best=s;}}
    if(best&&bd<300){tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';
      tip.textContent=best.p.name+' · '+LABELS[state.galaxy.x]+' '+fmt(best.p.x)+' / '+LABELS[state.galaxy.y]+' '+fmt(best.p.y)+' · '+best.p.n+' runs';}
    else tip.style.opacity=0;};
  cv.onmouseleave=()=>tip.style.opacity=0;
}

// ---- shared selects ----
function statSelect(label,cur,cb){return pickSelect(label,ALL_STATS.map(k=>[k,LABELS[k]]),cur,cb);}
function pickSelect(label,opts,cur,cb){
  const wrap=document.createElement('div'); wrap.className='f';
  const l=document.createElement('label'); l.textContent=label; wrap.appendChild(l);
  const sel=document.createElement('select');
  for(const [v,t] of opts){const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o);}
  sel.value=cur; sel.addEventListener('change',()=>cb(sel.value)); wrap.appendChild(sel); return wrap;
}

// ---- view switching ----
function setView(v){state.view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  render();}
function render(){
  const bits=activeBits(); const rows=filtered();
  document.getElementById('sub').textContent=DATA.length+' runs total · '+rows.length+' in view'+(bits.length?(' · '+bits.join(' · ')):'');
  document.getElementById('foot').textContent='Cigar Lounge Stats Lab · live from the bot';
  if(state.view==='matrix')renderMatrix();
  else if(state.view==='scatter')renderScatter();
  else if(state.view==='compare')renderCompare();
  else if(state.view==='trends')renderTrends();
  else renderGalaxy();
}

// ---- boot ----
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setView(t.dataset.v)));
fetch('/lab/data?t='+encodeURIComponent(TOKEN))
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(d=>{
    FIELDS=d.fields; FIELDS.forEach((f,i)=>IDX[f]=i);
    DATA=d.rows;
    buildFilters();
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===state.view));
    render();
  })
  .catch(e=>{document.getElementById('view').innerHTML='<div class="loading">Could not load data ('+e.message+'). The link may have expired — run <b>/correlate</b> again.</div>';});
</script>
