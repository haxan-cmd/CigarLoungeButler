<style>
:root{
  --bg:#22242a;--panel:#2b2d34;--panel2:#31343c;--ink:#f2f3f5;--mut:#8b8f9a;
  --gold:#e0a84c;--blue:#5b8dd9;--coral:#d85a30;--teal:#4fb3a1;--purple:#7a89c2;--grid:#34373f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,sans-serif;font-size:14px}
a{color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:2px}
.head h1{font-size:22px;margin:0;font-weight:700}
.head .sub{color:var(--mut);font-size:12.5px}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:10px 0 14px;opacity:.6}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding-left:2px}
select,input{background:var(--panel);color:var(--ink);border:1px solid var(--grid);border-radius:8px;padding:6px 9px;font-size:12.5px;font-family:inherit;min-width:96px}
select:focus,input:focus{outline:1px solid var(--gold)}
.cbox{position:relative}
.cbox input{width:100%}
.cblist{position:absolute;top:100%;left:0;right:0;z-index:40;background:var(--panel2);border:1px solid var(--grid);border-radius:8px;margin-top:3px;max-height:260px;overflow-y:auto;box-shadow:0 10px 26px #000a}
.cbitem{padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.cbitem:hover{background:var(--panel)}
.cbitem.sel{color:var(--gold)}
.btn{background:var(--panel);border:1px solid var(--grid);border-radius:8px;color:var(--mut);padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{color:var(--ink)}
.tabs{display:flex;flex-direction:column;margin-bottom:16px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:0 8px}
.tabrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--grid)}
.tabrow:last-child{border-bottom:none}
.tab{padding:8px 15px;font-size:13px;cursor:pointer;color:var(--mut);background:var(--panel2);border:1px solid var(--grid);border-radius:9px;font-family:inherit}
.tab:hover{color:var(--ink);border-color:var(--gold)}
.tab.on{background:var(--gold);color:#241c08;font-weight:700;border-color:var(--gold)}
.tablabel{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700;min-width:104px;flex:none;align-self:center}
.card{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--grid);border-radius:999px;padding:5px 11px;font-size:11.5px;color:var(--mut);cursor:pointer;user-select:none}
.chip.on{background:var(--panel2);color:var(--ink);border-color:var(--gold)}
/* matrix */
.mtx{display:grid;gap:3px;overflow-x:auto}
.mcell{aspect-ratio:1;min-width:44px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#12141a;cursor:pointer}
.mcell.lab{background:none!important;color:var(--mut);font-size:10px;font-weight:600;cursor:default;justify-content:flex-end;padding-right:4px;text-align:right}
.mcell.labtop{writing-mode:vertical-rl;transform:rotate(180deg);justify-content:flex-start;align-items:flex-start}
.mcell.diag{background:var(--gold)!important;color:#241c08}
.mcell:hover{outline:2px solid var(--ink)}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--mut);margin-top:10px;flex-wrap:wrap}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
/* scatter */
#scWrap{position:relative}
canvas{display:block;width:100%;border-radius:8px}
.rbox{position:absolute;top:10px;right:12px;background:#12141a;border:1px solid var(--grid);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
.slegend{position:absolute;top:10px;left:12px;font-size:11px;color:var(--mut);background:#12141acc;border-radius:8px;padding:6px 8px}
.slegend div{margin:2px 0}
.tip{position:fixed;pointer-events:none;background:#12141a;border:1px solid var(--grid);border-radius:7px;padding:6px 9px;font-size:11.5px;opacity:0;transition:.06s;z-index:60;white-space:nowrap}
/* compare */
.cmp .row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin-bottom:14px}
.cmp .k{font-size:12.5px;color:var(--ink);text-align:right}
.cmp .bars{display:flex;flex-direction:column;gap:4px}
.cmp .brow{display:flex;align-items:center;gap:8px;font-size:11px}
.cmp .bx{height:11px;border-radius:3px;min-width:2px}
.foot{color:var(--mut);font-size:11px;text-align:right;margin-top:8px}
.loading{color:var(--mut);padding:40px;text-align:center}
.hide{display:none}
.ce{height:1.15em;width:auto;vertical-align:-0.18em;margin:0 1px}
.brow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--grid);font-size:13px}
.brow:last-child{border-bottom:none}
.brow .rk{width:26px;text-align:right;color:var(--mut);flex:none}
.brow .bnm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bsc{font-weight:700;flex:none}
.brow.top .rk{color:var(--gold)}
.brow.top .pl{color:var(--gold);font-weight:700}
.bhead{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;margin-bottom:2px}
.bsub{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px}
.pl{color:#c9ccd3;cursor:pointer}
.pl:hover{color:var(--gold)}
.wimg{height:1.7em;width:auto;vertical-align:-0.45em;margin-right:7px}
.bspacer{display:block;width:100%;max-width:520px;margin:0 auto;opacity:.85}
.facsec{border-left:3px solid var(--grid);padding-left:12px;margin:18px 0 2px}
.pcard{max-width:660px}
.cardtitle{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.spkblock{margin:10px 0 4px;padding:10px 12px;background:var(--panel2);border:1px solid var(--grid);border-radius:10px}
.spkhd{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.spkrow{display:flex;align-items:center;gap:10px;padding:3px 0}
.spkl{font-size:12.5px;color:#c9ccd3;width:92px;flex:none}
.spksvg{flex:1;height:22px}
.spkv{font-size:13px;font-weight:700;width:52px;text-align:right;flex:none;color:var(--ink)}
@media(max-width:640px){.spkl{width:72px}.spkv{width:44px}}
.cardsec{font-weight:700;color:var(--gold);margin:15px 0 5px;font-size:13.5px}
.cardh2{font-size:15px;font-weight:700;color:var(--ink);margin:16px 0 6px}
.cardbul{padding:3px 0 3px 2px;font-size:13px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;line-height:1.5}
.cardbul::before{content:"›";color:var(--mut);margin-right:2px}
.cardbul img.ce,.cardsec img.ce{height:1.25em;vertical-align:-0.2em}
.meter{display:inline-block;width:78px;height:9px;background:var(--panel2);border:1px solid var(--grid);border-radius:5px;overflow:hidden;vertical-align:middle;margin:0 4px}
.meterfill{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--coral))}
@media(max-width:640px){
  .wrap{padding:10px 10px 46px}
  .head h1{font-size:17px}
  .head{gap:6px}
  .bar{gap:6px}
  .f{flex:1 1 44%}
  .cbox input,select{min-width:0;width:100%}
  .tab{padding:7px 9px;font-size:12px}
  .tabrow{padding:8px 2px}
  .tablabel{min-width:100%;margin-bottom:2px}
  .cblist{max-height:200px}
  .cmp .row{grid-template-columns:70px 1fr;gap:6px}
  .cmp .k{font-size:11px}
  .card{padding:12px 12px}
  .clnav{padding:10px 10px 0}
  .mtx{gap:2px}
  .mcell{min-width:34px;font-size:10px}
  .chip{font-size:11px;padding:4px 9px}
  .btn{padding:6px 10px;font-size:12px}
  h1{font-size:16px}
}
.clnav{display:flex;align-items:center;gap:4px;max-width:1180px;margin:0 auto;padding:14px 20px 0;flex-wrap:wrap}
.clnav .brand{font-weight:700;font-size:15px;color:var(--gold);margin-right:12px;letter-spacing:.3px}
.clnav a{color:var(--mut);text-decoration:none;font-size:13px;padding:7px 14px;border-radius:9px;font-weight:600}
.clnav a:hover{color:var(--ink)}
.clnav a.on{background:var(--gold);color:#241c08}
.clnav a.joinbtn{margin-left:auto;background:var(--gold);color:#241c08;font-weight:700}
.clnav a.joinbtn:hover{color:#241c08;filter:brightness(1.08)}

/* ---- interaction & polish pass ---- */
html{scroll-behavior:smooth}
::selection{background:var(--gold);color:#241c08}
*{-webkit-tap-highlight-color:transparent}
/* smooth state changes on interactive controls */
.tab,.btn,.chip,.clnav a,.pl,.cbitem,select,input{
  transition:background .14s ease,color .14s ease,border-color .14s ease,transform .08s ease,box-shadow .14s ease}
.tab:active,.btn:active,.chip:active,.clnav a:active{transform:translateY(1px)}
/* keyboard focus rings (mouse clicks stay clean) */
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.clnav a:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px}
select:focus,input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px #e0a84c33}
/* sticky top nav so brand + sections stay reachable while scrolling */
.clnav{position:sticky;top:0;z-index:50;background:#22242aef;backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--grid);padding-top:12px;padding-bottom:10px}
/* clickable player names read as links */
.pl{text-decoration:underline;text-decoration-color:transparent;text-underline-offset:2px}
.pl:hover{text-decoration-color:var(--gold)}
/* animated loading, so a slow fetch doesn't look frozen */
.loading{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
/* header copy-link button, always reachable */
#copybtn{margin-left:auto;align-self:center;flex:none}
/* empty / no-data states read differently from a live loading spinner */
.empty{color:var(--mut);padding:34px 20px;text-align:center;font-size:13.5px;line-height:1.6}
.empty::before{content:"🗒️";display:block;font-size:26px;margin-bottom:8px;opacity:.7}
/* thin themed scrollbars */
.cblist,.mtx{scrollbar-width:thin;scrollbar-color:var(--grid) transparent}
.cblist::-webkit-scrollbar,.mtx::-webkit-scrollbar{height:8px;width:8px}
.cblist::-webkit-scrollbar-thumb,.mtx::-webkit-scrollbar-thumb{background:var(--grid);border-radius:8px}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<nav class="clnav"><a href="/" class="brand">Cigar Lounge</a><a href="/hof">Hall of Fame</a><a href="/lab" class="on">Stats Lab</a><a class="joinbtn" href="/join" target="_blank" rel="noopener">Apply to join</a></nav>
<div class="wrap">
  <div class="head">
    <h1>Stats Lab</h1>
    <span class="sub" id="sub">loading…</span>
    <button class="btn" id="copybtn" title="Copy a link to this exact view and filters">🔗 Copy link</button>
  </div>
  <div class="rule"></div>

  <div class="bar" id="filters"></div>

  <div class="tabs" id="tabs">

      <span class="tablabel">Profiles</span>

</div>
<div class="tip" id="tip"></div>

<script>
const PALETTE=['#e0a84c','#5b8dd9','#d85a30','#4fb3a1','#7a89c2','#e0729b','#8bd3dd','#b5e48c','#f4a259'];
const FACTION_COL={Agatha:'#5b8dd9',Mason:'#d84343',Tenosia:'#e0a84c'};
const FACTION_THEME={Agatha:'#5b8dd9',Mason:'#d84343',Tenosia:'#bcb23f'};
const GRIP_COL={'1H':'#5b8dd9','2H':'#e0a84c'};
const LABELS={kills:'Kills',td:'Takedowns',deaths:'Deaths',kd:'K/D ratio',
  aggression:'Aggression (K+D)',kill_share:'Kill share %',team_td_share:'Team TD share %',
  warlord:'Warlord %',dominance:'Dominance',lethality:'Lethality (K/TD)',score:'Score',
  lobby_kills:'Total lobby kills',tilt:'Lobby kill gap',td_lead:'TD lead over teammate',marks:'Marks earned'};
let ALL_STATS=Object.keys(LABELS);
const DEFAULT_MATRIX=['kills','td','deaths','kd','kill_share','warlord','tilt'];

const qp=new URLSearchParams(location.search);
const TOKEN=qp.get('t')||'';
let FIELDS=[], IDX={}, DATA=[], PMARKS=[], BOARDS={}, EMOJI={};
let matrixStats=DEFAULT_MATRIX.slice();
const state={
  view:qp.get('view')||'weaponboards',
  x:qp.get('x')||'td', y:qp.get('y')||'kills', colour:qp.get('colour')||'',
  group:'grip', compareStats:['kills','td','deaths','kd','kill_share','warlord'], compareMin:3, compareScale:'auto',
  trend:{stat:'kill_share',period:'week',split:''},
  galaxy:{x:'aggression',y:'kill_share',colour:'cls',min:10},
  activity:{tz:0},
  ranking:{stat:'tilt',min:5,order:'desc',agg:'avg',q:''},
  weapons:{by:'runs',order:'asc',archer:'hide'},
  boards:{map:'',weapon:'',feat:''},
  playercard:{name:'',loading:false,data:null,err:''},
  filters:{player:qp.get('player')||'',weapon:qp.get('weapon')||'',cls:qp.get('class')||'',
           grip:qp.get('grip')||'',faction:qp.get('faction')||'',map:qp.get('map')||'',side:qp.get('side')||'',vip:qp.get('vip')||''}
};

function val(rec,key){return rec[IDX[key]];}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// ---- tiny auto-escaping HTML templating (no build step) ----
// html`...` escapes every ${value} by default, so a forgotten esc() can't XSS. Wrap
// trusted markup in raw() to inject it verbatim (nested html`` results are already
// Raw, so they compose without double-escaping). Arrays are joined. Assign the result
// straight to .innerHTML — the setter calls toString().
class Raw{constructor(s){this.s=s==null?'':String(s);}toString(){return this.s;}}
function raw(s){return new Raw(s);}
function _hv(v){
  if(v==null||v===false||v===true)return '';
  if(v instanceof Raw)return v.s;
  if(Array.isArray(v))return v.map(_hv).join('');
  return esc(v);
}
function html(strings,...vals){
  let out=strings[0];
  for(let i=0;i<vals.length;i++)out+=_hv(vals[i])+strings[i+1];
  return new Raw(out);
}
function pearson(pairs){
  const n=pairs.length; if(n<3) return null;
  let mx=0,my=0; for(const p of pairs){mx+=p[0];my+=p[1];} mx/=n;my/=n;
  let sxx=0,syy=0,sxy=0;
  for(const p of pairs){const dx=p[0]-mx,dy=p[1]-my;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy;}
  if(sxx<=0||syy<=0) return null;
  return {r:sxy/Math.sqrt(sxx*syy),m:sxy/sxx,b:my-(sxy/sxx)*mx};
}
function uniques(key){
  const s=new Set();
  for(const r of DATA){const v=r[IDX[key]]; if(v) s.add(v);}
  return [...s].sort();
}
function filtered(){
  const f=state.filters;
  return DATA.filter(r=>{
    if(f.player && (r[IDX.name]||'')!==f.player && (r[IDX.did]||'')!==f.player) return false;
    if(f.weapon && (r[IDX.weapon]||'')!==f.weapon) return false;
    if(f.cls && (r[IDX.cls]||'')!==f.cls) return false;
    if(f.grip && (r[IDX.grip]||'')!==f.grip) return false;
    if(f.faction && (r[IDX.faction]||'')!==f.faction) return false;
    if(f.map && (r[IDX.map]||'')!==f.map) return false;
    if(f.side && (r[IDX.side]||'')!==f.side) return false;
    if(f.vip && (r[IDX.vip]||'')!==f.vip) return false;
    return true;
  });
}
function activeBits(){
  const f=state.filters, out=[];
  for(const [k,lab] of [['player','Player'],['weapon','Weapon'],['cls','Class'],['grip','Weapon Type'],['faction','Faction'],['map','Map'],['side','Side']])
    if(f[k]) out.push(f[k]);
  return out;
}

// ---- filters UI ----
function searchSelect(label,options,current,cb,width){
  const wrap=document.createElement('div'); wrap.className='f';
  const l=document.createElement('label'); l.textContent=label; wrap.appendChild(l);
  const box=document.createElement('div'); box.className='cbox';
  const input=document.createElement('input'); input.type='text'; input.placeholder='all';
  input.autocomplete='off'; input.value=current||''; if(width) input.style.minWidth=width+'px';
  const list=document.createElement('div'); list.className='cblist hide';
  let cur=current||''; const all=['',...options];
  function draw(f){
    list.innerHTML=''; const q=(f||'').toLowerCase();
    all.filter(o=>o===''||o.toLowerCase().includes(q)).slice(0,300).forEach(o=>{
      const it=document.createElement('div'); it.className='cbitem'+(o===cur?' sel':'');
      it.textContent=o===''?'all':o;
      it.addEventListener('mousedown',e=>{e.preventDefault();cur=o;input.value=o;list.classList.add('hide');input.blur();cb(o);});
      list.appendChild(it);
    });
  }
  input.addEventListener('focus',()=>{input.value='';draw('');list.classList.remove('hide');});
  input.addEventListener('input',()=>draw(input.value));
  input.addEventListener('blur',()=>setTimeout(()=>{list.classList.add('hide');input.value=cur;},120));
  box.appendChild(input); box.appendChild(list); wrap.appendChild(box);
  return wrap;
}
function shareUrl(){
  const p=new URLSearchParams(); p.set('view',state.view);
  const map={player:'player',weapon:'weapon',cls:'class',grip:'grip',faction:'faction',map:'map',side:'side',vip:'vip'};
  for(const k in map){ if(state.filters[k]) p.set(map[k],state.filters[k]); }
  return location.origin+location.pathname+'?'+p.toString();
}
function buildFilters(){
  const bar=document.getElementById('filters'); bar.innerHTML='';
  const defs=[['player','Player','name',190],['weapon','Weapon','weapon',150],['cls','Class','cls',110],
    ['grip','Weapon Type','grip',130],['faction','Faction','faction',120],['map','Map','map',140],['side','Side','side',110],['vip','VIP','vip',100]];
  for(const [fk,lab,uk,w] of defs){
    bar.appendChild(searchSelect(lab, uniques(uk), state.filters[fk]||'',
      v=>{state.filters[fk]=v;render();}, w));
  }
  const reset=document.createElement('button'); reset.className='btn'; reset.textContent='Reset';
  reset.style.alignSelf='flex-end';
  reset.addEventListener('click',()=>{for(const k in state.filters)state.filters[k]='';buildFilters();render();});
  bar.appendChild(reset);
  // (Copy-link lives in the header now, so it's available on every view — not just

function drawScatter(cv,wrap,pts){

  const dpr=window.devicePixelRatio||1; cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  const g=cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  const pad={l:52,r:16,t:16,b:36};
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  const sx=v=>pad.l+(v-xmin)/((xmax-xmin)||1)*(W-pad.l-pad.r);
  const sy=v=>H-pad.b-(v-ymin)/((ymax-ymin)||1)*(H-pad.t-pad.b);
  // axes
  g.strokeStyle='#34373f'; g.lineWidth=1; g.fillStyle='#8b8f9a'; g.font='11px Poppins,sans-serif';
  for(let i=0;i<=4;i++){const t=i/4;

    const yy=sy(yv), xx=sx(xv);

    g.fillText(fmt(yv),6,yy+4); g.fillText(fmt(xv),xx-8,H-pad.b+16);
  }
  // colour groups
  let colFn=()=>'#e0a84c', legend=null;
  if(state.colour){
    const cats=[...new Set(pts.map(p=>p.cat))];
    const freq={}; pts.forEach(p=>freq[p.cat]=(freq[p.cat]||0)+1);
    const keep=cats.sort((a,b)=>freq[b]-freq[a]).slice(0,8);
    const cmap={}; keep.forEach((c,i)=>cmap[c]=PALETTE[i%PALETTE.length]);
    if(state.colour==='faction')keep.forEach(c=>{if(FACTION_COL[c])cmap[c]=FACTION_COL[c];});
    if(state.colour==='grip')keep.forEach(c=>{if(GRIP_COL[c])cmap[c]=GRIP_COL[c];});
    colFn=p=>cmap[p.cat]||'#8a8f98'; legend=keep.map(c=>[c,cmap[c]]);

  // points

    g.beginPath();g.arc(px,py,3.4,0,7);g.fillStyle=colFn(p);g.globalAlpha=.85;g.fill();g.globalAlpha=1;}
  if(res){g.strokeStyle='#d85a30';g.lineWidth=2.2;g.globalAlpha=.9;g.beginPath();
    g.moveTo(sx(xmin),sy(res.m*xmin+res.b));g.lineTo(sx(xmax),sy(res.m*xmax+res.b));g.stroke();g.globalAlpha=1;}
  // r box
  const rb=document.createElement('div'); rb.className='rbox';
  if(res){const mag=Math.abs(res.r);const strength=mag<.15?'no':mag<.4?'weak':mag<.7?'moderate':'strong';
    const dir=mag<.15?'':(res.r>0?' positive':' negative');
    rb.style.color=res.r>=0?'#4fb3a1':'#d85a30'; rb.textContent='r = '+(res.r>=0?'+':'')+res.r.toFixed(2)+'  ('+strength+dir+')';}
  else rb.textContent='r = n/a';
  wrap.appendChild(rb);
  if(legend){const lg=document.createElement('div');lg.className='slegend';
    lg.innerHTML=legend.map(([c,col])=>'<div><span class="sw" style="background:'+col+'"></span>'+esc(c)+'</div>').join('');
    wrap.appendChild(lg);}
  // hover
  const tip=document.getElementById('tip');
  cv.onmousemove=e=>{const rect=cv.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    let best=null,bd=1e9;
    for(const s of screen){const d=(s.px-mx)**2+(s.py-my)**2; if(d<bd){bd=d;best=s;}}
    if(best&&bd<160){tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';
      cv.style.cursor=best.p.link?'pointer':'default';

  cv.onclick=e=>{const rect=cv.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    let best=null,bd=1e9; for(const s of screen){const d=(s.px-mx)**2+(s.py-my)**2; if(d<bd){bd=d;best=s;}}
    if(best&&bd<160&&best.p.link)window.open(best.p.link,'_blank','noopener');};
  cv.onmouseleave=()=>{tip.style.opacity=0;cv.style.cursor='default';};
}

// ---- trends ----
function periodKey(ts,period){
  if(!ts) return null;
  const d=ts.slice(0,10);
  if(period==='month') return ts.slice(0,7);
  const dt=new Date(d+'T00:00:00Z'); if(isNaN(dt)) return null;

  return dt.toISOString().slice(0,10);
}
function renderTrends(){
  const rows=filtered();
  const view=document.getElementById('view'); view.innerHTML='';
  const ctrl=document.createElement('div'); ctrl.className='bar';
  ctrl.appendChild(statSelect('Stat',state.trend.stat,v=>{state.trend.stat=v;renderTrends();}));
  ctrl.appendChild(pickSelect('Period',[['week','Weekly'],['month','Monthly']],state.trend.period,v=>{state.trend.period=v;renderTrends();}));
  ctrl.appendChild(pickSelect('Split by',[['','None (server)'],['cls','Class'],['grip','Weapon Type'],['faction','Faction'],['vip','VIP status']],state.trend.split,v=>{state.trend.split=v;renderTrends();}));
  view.appendChild(ctrl);
  const stat=state.trend.stat, period=state.trend.period, split=state.trend.split;
  const buckets={}, groupsSet=new Set();
  for(const r of rows){
    const v=val(r,stat); if(v==null) continue;
    const pk=periodKey(r[IDX.ts],period); if(!pk) continue;
    const g=split?(r[IDX[split]]||'—'):'all'; groupsSet.add(g);
    const b=buckets[pk]||(buckets[pk]={}); const e=b[g]||(b[g]=[0,0]); e[0]+=v; e[1]++;
  }
  const periods=Object.keys(buckets).sort();
  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<h3>'+LABELS[stat]+' over time · '+(period==='week'?'weekly':'monthly')+' · '+rows.length+' runs</h3>';
  if(periods.length<2){card.innerHTML+='<div class="empty">Not enough time range yet — widen the filters.</div>';view.appendChild(card);return;}
  let groups=[...groupsSet];
  if(split){
    const cnt={}; for(const pk of periods) for(const g in buckets[pk]) cnt[g]=(cnt[g]||0)+buckets[pk][g][1];
    groups=groups.filter(g=>g!=='—').sort((a,b)=>cnt[b]-cnt[a]).slice(0,6);
  }
  const cmap={}; groups.forEach((g,i)=>{cmap[g]=PALETTE[i%PALETTE.length];
    if(split==='faction'&&FACTION_COL[g])cmap[g]=FACTION_COL[g];
    if(split==='grip'&&GRIP_COL[g])cmap[g]=GRIP_COL[g];});
  const wrap=document.createElement('div'); wrap.id='scWrap'; const cv=document.createElement('canvas'); wrap.appendChild(cv); card.appendChild(wrap); view.appendChild(card);
  drawTrends(cv,wrap,periods,groups,cmap,buckets,split);
}
function drawTrends(cv,wrap,periods,groups,cmap,buckets,split){

  const g=cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  const pad={l:54,r:16,t:16,b:46};
  const series={}; let ymin=Infinity,ymax=-Infinity;
  groups.forEach(gr=>{series[gr]=periods.map(pk=>{const e=buckets[pk][gr]; if(e&&e[1]>=3){const v=e[0]/e[1]; if(v<ymin)ymin=v; if(v>ymax)ymax=v; return v;} return null;});});
  if(!isFinite(ymin)){ymin=0;ymax=1;} if(ymin===ymax){ymax=ymin+1;}
  const n=periods.length;
  const sx=i=>pad.l+(n<=1?0:i/(n-1))*(W-pad.l-pad.r);
  const sy=v=>H-pad.b-(v-ymin)/((ymax-ymin)||1)*(H-pad.t-pad.b);
  g.strokeStyle='#34373f'; g.fillStyle='#8b8f9a'; g.font='11px Poppins,sans-serif';
  for(let i=0;i<=4;i++){const yv=ymin+(ymax-ymin)*i/4, yy=sy(yv);
    g.globalAlpha=.5;g.beginPath();g.moveTo(pad.l,yy);g.lineTo(W-pad.r,yy);g.stroke();g.globalAlpha=1;g.fillText(fmt(yv),6,yy+4);}
  const step=Math.max(1,Math.ceil(n/8));

    let best=null,bd=1e9; for(const s of screen){const d=(s.px-mx)**2+(s.py-my)**2; if(d<bd){bd=d;best=s;}}

      tip.textContent=best.pk+(split?(' · '+best.gr):'')+' · '+LABELS[state.trend.stat]+' '+fmt(best.v);}
    else tip.style.opacity=0;};
  cv.onmouseleave=()=>tip.style.opacity=0;
}

function renderGalaxy(){

  view.appendChild(ctrl);

    const cat=Object.keys(a.cats).sort((x,y)=>a.cats[y]-a.cats[x])[0];

function drawGalaxy(cv,wrap,pts){
  const W=cv.clientWidth||900,H=Math.round((W||900)*0.62);
  const dpr=window.devicePixelRatio||1; cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
  const g=cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  const pad={l:54,r:16,t:16,b:38};
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  const xr=(xmax-xmin)*0.06||1,yr=(ymax-ymin)*0.06||1; xmin-=xr;xmax+=xr;ymin-=yr;ymax+=yr;
  const sx=v=>pad.l+(v-xmin)/((xmax-xmin)||1)*(W-pad.l-pad.r);
  const sy=v=>H-pad.b-(v-ymin)/((ymax-ymin)||1)*(H-pad.t-pad.b);
  const med=arr=>{const s=[...arr].sort((a,b)=>a-b);return s[Math.floor(s.length/2)];};
  const cx=med(xs),cy=med(ys);
  g.strokeStyle='#34373f';g.setLineDash([4,4]);g.globalAlpha=.7;
  g.beginPath();g.moveTo(sx(cx),pad.t);g.lineTo(sx(cx),H-pad.b);g.stroke();
  g.beginPath();g.moveTo(pad.l,sy(cy));g.lineTo(W-pad.r,sy(cy));g.stroke();
  g.setLineDash([]);g.globalAlpha=1;
  g.fillStyle='#8b8f9a';g.font='11px Poppins,sans-serif';
  for(let i=0;i<=4;i++){const t=i/4;g.fillText(fmt(ymin+(ymax-ymin)*t),6,sy(ymin+(ymax-ymin)*t)+4);g.fillText(fmt(xmin+(xmax-xmin)*t),sx(xmin+(xmax-xmin)*t)-8,H-pad.b+16);}
  const cats=[...new Set(pts.map(p=>p.cat))];
  const freq={};pts.forEach(p=>freq[p.cat]=(freq[p.cat]||0)+1);
  const keep=cats.sort((a,b)=>freq[b]-freq[a]).slice(0,8);
  const cmap={};keep.forEach((c,i)=>cmap[c]=PALETTE[i%PALETTE.length]);
  if(state.galaxy.colour==='faction')keep.forEach(c=>{if(FACTION_COL[c])cmap[c]=FACTION_COL[c];});
  if(state.galaxy.colour==='grip')keep.forEach(c=>{if(GRIP_COL[c])cmap[c]=GRIP_COL[c];});
  const col=p=>cmap[p.cat]||'#8a8f98';
  const maxn=Math.max(...pts.map(p=>p.n));
  const screen=[];
  for(const p of pts){const px=sx(p.x),py=sy(p.y),rad=4+6*Math.sqrt(p.n/maxn);
    g.beginPath();g.arc(px,py,rad,0,7);g.fillStyle=col(p);g.globalAlpha=.82;g.fill();g.globalAlpha=1;screen.push({px,py,rad,p});}
  const labelled=[...pts].sort((a,b)=>b.n-a.n).slice(0,8);
  g.fillStyle='#f2f3f5';g.font='11px Poppins,sans-serif';
  for(const p of labelled){g.fillText(p.name,sx(p.x)+7,sy(p.y)+3);}
  const lg=document.createElement('div');lg.className='slegend';
  lg.innerHTML=keep.map(c=>'<div><span class="sw" style="background:'+cmap[c]+'"></span>'+esc(c)+'</div>').join('');wrap.appendChild(lg);
  const tip=document.getElementById('tip');
  cv.onmousemove=e=>{const rect=cv.getBoundingClientRect();const mxp=e.clientX-rect.left,myp=e.clientY-rect.top;
    let best=null,bd=1e9;for(const s of screen){const d=(s.px-mxp)**2+(s.py-myp)**2;if(d<bd){bd=d;best=s;}}
    if(best&&bd<300){tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';cv.style.cursor='pointer';
      tip.textContent=best.p.name+' · '+LABELS[state.galaxy.x]+' '+fmt(best.p.x)+' / '+LABELS[state.galaxy.y]+' '+fmt(best.p.y)+' · '+best.p.n+' runs · click to filter';}
    else {tip.style.opacity=0;cv.style.cursor='default';}};
  cv.onclick=e=>{const rect=cv.getBoundingClientRect();const mxp=e.clientX-rect.left,myp=e.clientY-rect.top;
    let best=null,bd=1e9;for(const s of screen){const d=(s.px-mxp)**2+(s.py-myp)**2;if(d<bd){bd=d;best=s;}}
    if(best&&bd<300){state.filters.player=best.p.name||'';buildFilters();render();}};
  cv.onmouseleave=()=>{tip.style.opacity=0;cv.style.cursor='default';};
}

// ---- activity (submission timing + cadence) ----
function _barBlock(title,sub,items,color){

  if(sub)h+='<div style="color:#8b8f9a;font-size:12px;margin:-4px 0 10px">'+esc(sub)+'</div>';

  for(const r of rows){

  const odPct=players?Math.round(oneDone/players*100):0;
  const buckets=[['1',c=>c===1],['2',c=>c===2],['3–5',c=>c>=3&&c<=5],['6–10',c=>c>=6&&c<=10],['11–20',c=>c>=11&&c<=20],['21+',c=>c>=21]];
  const bItems=buckets.map(b=>({label:b[0],n:counts.filter(b[1]).length}));

  html+=_barBlock('Runs per player · one-and-done vs grinders',
        players+' players · '+totalRuns+' runs · '+odPct+'% one-and-done · median '+median+' runs/player',

  const holder=document.createElement('div'); holder.innerHTML=html;
  while(holder.firstChild) view.appendChild(holder.firstChild);

const TILT_BANDS=[[40,'Training Grounds','🍼'],[22,'Favoured','🟢'],[10,'Slightly Favoured','🟢'],[-10,'Even','🟡'],[-22,'Slightly Uphill','🟠'],[-40,'Outmatched','🟠'],[-999,'Brutal','🔴']];
function tiltBand(p){for(const b of TILT_BANDS){if(p>=b[0])return b;}return TILT_BANDS[TILT_BANDS.length-1];}
function lobbyGameRanking(){

  // Highest first = biggest steamrolls, Lowest first = most brutal.
  const rows=filtered(); const games=[];

      +'<span style="flex:1;min-width:50px"><span style="display:inline-block;height:11px;border-radius:3px;background:'+col+';width:'+w+'%"></span></span>'
      +'<span style="width:170px;color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+b[2]+' '+esc(b[1])+' · '+esc(mp)+'</span>'
      +'<span style="width:56px;text-align:right;font-weight:600">'+sign+g.p+'%'+(lk?' <span style="color:var(--mut)">↗</span>':'')+'</span>';

function renderRanking(){

function _unesc(s){return String(s).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");}
// A card link whose text names one of OUR boards -> keep it on the site (jump to that
// board tab). Everything else (individual games) keeps its Discord jump link.
function _boardFromText(t){
  if(BOARDS[t]) return {kind:(BOARDS[t].kind||'weapon'),key:t};
  if(t.indexOf(' - ')>=0){ const mp=t.split(' - ')[0].trim(); if(BOARDS[mp]&&(BOARDS[mp].kind==='map')) return {kind:'map',key:mp}; }
  const wk=t.replace(/ Kills$/,''); if(wk!==t && BOARDS[wk]) return {kind:'weapon',key:wk};
  return null;
}
function navBoard(t){
  const bd=_boardFromText(t); if(!bd) return;
  state.boards[bd.kind]=bd.key;
  setView({map:'maps',weapon:'weaponboards',feat:'feats'}[bd.kind]);
}
function _mdInline(s){
  s=esc(s).replace(/&lt;(a?):(\w+):(\d+)&gt;/g,function(_,a,nm,id){
    return '<img class="ce" src="https://cdn.discordapp.com/emojis/'+id+'.'+(a==='a'?'gif':'png')+'" alt="" title="'+nm+'">';});
  // progress meters `[■□□□]` / [▰▱▱] -> a real HTML bar
  s=s.replace(/`?\[([■□▰▱▮▯█░]{2,})\]`?/g,function(_,bar){
    const arr=[...bar], filled=arr.filter(c=>'■▰▮█'.indexOf(c)>=0).length, total=arr.length;
    const pct=total?Math.round(filled/total*100):0;
    return '<span class="meter" title="'+filled+'/'+total+'"><span class="meterfill" style="width:'+pct+'%"></span></span>';
  });
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,function(_,t,u){
    const bd=_boardFromText(_unesc(t));
    if(bd) return '<a href="#" data-board="'+esc(_unesc(t))+'" style="color:var(--blue)">'+t+'</a>';  // on-site board
    const safe=/^https?:\/\//i.test(u)?u:'#';  // allowlist http(s) only; block javascript:/data: etc.
    return '<a href="'+safe+'" target="_blank" rel="noopener" style="color:var(--blue)">'+t+'</a>';    // individual game -> Discord
  });
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  s=s.replace(/`([^`]+)`/g,'<code style="background:var(--panel2);padding:0 4px;border-radius:4px;font-size:12px">$1</code>');
  return s;
}
function mdToHtml(text){
  const out=[];
  String(text||'').split('\n').forEach(function(ln){
    const t=ln.trim();
    if(!t){ out.push('<div style="height:6px"></div>'); return; }
    let m=t.match(/^\*\*(.+?):?\*\*:?$/);           // a lone bold label = section header
    if(m){ out.push('<div class="cardsec">'+_mdInline(m[1])+'</div>'); return; }
    m=t.match(/^#{1,3}\s+(.+)$/);
    if(m){ out.push('<div class="cardh2">'+_mdInline(m[1])+'</div>'); return; }
    m=t.match(/^•\s+(.+)$/);
    if(m){ out.push('<div class="cardbul">'+_mdInline(m[1])+'</div>'); return; }
    out.push('<div style="font-size:13px;padding:2px 0">'+_mdInline(t)+'</div>');
  });
  return raw(out.join(''));
}
function loadCard(name){

}
function _sparkSvg(data,color,area){
  const w=120,h=22,pad=3,mn=Math.min.apply(null,data),mx=Math.max.apply(null,data),rng=(mx-mn)||1;
  const pts=data.map(function(v,i){return [pad+i*(w-2*pad)/((data.length-1)||1), h-pad-((v-mn)/rng)*(h-2*pad)];});
  const line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
  const last=pts[pts.length-1];
  let inner='';
  if(area) inner+='<polygon points="'+pad+','+(h-pad)+' '+line+' '+(w-pad)+','+(h-pad)+'" fill="'+color+'" opacity="0.12"/>';
  inner+='<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>';
  inner+='<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.3" fill="'+color+'"/>';
  return '<svg class="spksvg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+inner+'</svg>';
}
// Recent-form sparklines for a player, computed from the runs the Lab already holds.
function _cardSparks(name,did){
  if(!DATA||!DATA.length) return '';
  const nkey=(name||'').toLowerCase().trim();
  let rows=DATA.filter(function(r){
    return (r[IDX.name]||'').toLowerCase().trim()===nkey || (did && r[IDX.did]===did);
  });
  if(rows.length<3) return '';
  const ti=IDX.ts;
  if(ti!=null) rows=rows.slice().sort(function(a,b){return String(a[ti]||'').localeCompare(String(b[ti]||''));});
  rows=rows.slice(-15);
  const cs=getComputedStyle(document.documentElement);
  const gold=(cs.getPropertyValue('--gold').trim())||'#e0a84c';
  const mut=(cs.getPropertyValue('--mut').trim())||'#8b8f9a';
  const specs=[['td','Takedowns',gold,true,''],['kills','Kills',mut,false,''],
               ['kill_share','Kill share',gold,false,'%'],['warlord','Warlord',mut,false,'%']];
  let out='';
  specs.forEach(function(s){
    const idx=IDX[s[0]]; if(idx==null) return;
    const series=rows.map(function(r){const v=parseFloat(r[idx]); return isFinite(v)?v:null;}).filter(function(v){return v!=null;});
    if(series.length<3) return;
    const lastv=series[series.length-1];
    const disp=(s[4]==='%')?(Math.round(lastv*10)/10+'%'):Math.round(lastv);
    out+='<div class="spkrow"><span class="spkl">'+s[1]+'</span>'+_sparkSvg(series,s[2],s[3])+'<span class="spkv">'+disp+'</span></div>';
  });
  return out ? '<div class="spkblock"><div class="spkhd">Recent form · last '+rows.length+' games</div>'+out+'</div>' : '';
}

      +'<td style="padding:4px 6px">'+esc(it.w)+(it.archer?' <span style="color:#8b8f9a;font-size:11px">archer</span>':'')+'</td>'
      +'<td style="padding:4px 6px;text-align:right;color:#e0a84c;font-weight:600">'+it.runs+'</td>'
      +'<td style="padding:4px 6px;text-align:right;color:#c9ccd3">'+it.players+'</td>'

      +'</tr>';
  }
  html+='</table></div>';

  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(d=>{
    FIELDS=d.fields; FIELDS.forEach((f,i)=>IDX[f]=i);
    DATA=d.rows;
    PMARKS=d.player_marks||[];
    if(d.stat_labels){ Object.assign(LABELS,d.stat_labels); ALL_STATS=Object.keys(d.stat_labels); }
    BOARDS=d.boards||{}; EMOJI=d.emoji||{};
    buildFilters();
    // Delegated view clicks. A player name (data-card) opens that player's card;
    // a board name (data-board) jumps to that board; data-player is the legacy
    // filter-to-player path, kept for any spot that still uses it.
    document.getElementById('view').addEventListener('click',function(e){
      const cel=e.target.closest('[data-card]');
      if(cel){ e.preventDefault(); const nm=cel.getAttribute('data-card')||'';
        if(nm){ state.playercard.name=nm; state.playercard.data=null; state.playercard.loading=false; setView('players'); } return; }
      const bel=e.target.closest('[data-board]');
      if(bel){ e.preventDefault(); navBoard(bel.getAttribute('data-board')||''); return; }
      const el=e.target.closest('[data-player]');
      if(el){ e.preventDefault(); state.filters.player=el.getAttribute('data-player')||''; buildFilters(); render(); }
    });
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===state.view));
    render();
  })
  .catch(e=>{document.getElementById('view').innerHTML='<div class="loading">Could not load data ('+e.message+'). Try reloading the page.</div>';});
</script>
</body>
</html>
